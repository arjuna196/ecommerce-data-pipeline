version: 2

models:
  - name: stg_products
    description: One row per product.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: price
        data_tests:
          - not_null

  - name: stg_users
    description: One row per user. Sensitive fields are deliberately excluded.
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null

  - name: stg_carts
    description: One row per cart (order).
    columns:
      - name: cart_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id

  - name: stg_cart_items
    description: One row per line in a cart. The same product can appear on more than one line.
    columns:
      - name: cart_item_id
        data_tests:
          - unique
          - not_null
      - name: cart_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_carts')
                field: cart_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
